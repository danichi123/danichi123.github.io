<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorización de TikTok</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}
code{display:block;word-break:break-all;background:#f3f3f3;padding:14px;border-radius:8px;font-size:15px}</style></head>
<body>
<h1>Autorización de TikTok</h1>
<p>Copia este código y pégalo en la terminal, en el comando <b>python fabrica/tiktok_autorizar.py --codigo …</b></p>
<code id="c">(sin código: vuelve a abrir el enlace de autorización)</code>
<p id="e" style="color:#b00"></p>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("code")) document.getElementById("c").textContent = q.get("code");
  if (q.get("error")) document.getElementById("e").textContent = "TikTok devolvió: " + q.get("error") + " " + (q.get("error_description") || "");
</script>
<p><a href="index.html">Inicio</a> · <a href="privacidad.html">Política de privacidad</a></p>
</body></html>
